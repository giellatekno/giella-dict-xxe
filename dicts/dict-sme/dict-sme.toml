# North Sámi dictionary (giellalt/dict-sme). make_config.py makes
# dict-sme.xxe and dict-sme.css from this file.

# the id of the root element of the files: <r id="dict-sme">
id = "dict-sme"

# entries are put in batches (batches/batches.xml)
batches = true

# the pos values offered, in this order; as in schema/dict-sme.rnc
pos = ["A", "N", "V", "Adv", "Po", "Pr", "Pron", "Phrase", "Rel", "Det",
       "Interj", "Pcle", "Num", "CC", "CS"]

# the homograph numbers offered: 1 to this
homographs = 4

# the types that go with each pos; a pos not listed has no types
[types]
N = ["Prop", "NomAg", "Coll", "ACR", "ABBR", "G3", "G7"]
A = ["Ord"]
Pron = ["Pers", "Dem", "Indef", "Interr", "Recipr", "Refl", "Rel"]
